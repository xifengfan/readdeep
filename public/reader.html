<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>陪读室 · 读透（ReadDeep）</title>
  <meta name="description" content="选书 → 选章节 → 4 个 AI 角色陪读。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          ink:    { 900: '#1a1a1a', 700: '#3d3d3d', 500: '#737373', 300: '#d4d4d4', 100: '#f5f5f5' },
          paper:  { 50: '#fafaf7', 100: '#f5e6d3', 200: '#e8d5b7' },
          accent: { 500: '#c1272d', 600: '#a11f25' },
        },
        fontFamily: { sans: ['"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'] }
      }}
    }
  </script>
  <script src="reader.js" defer></script>
</head>
<body class="bg-paper-50 text-ink-900 antialiased paper"
      style="font-family: var(--font-sans); line-height: var(--leading-relaxed)">

  <header class="sticky top-0 z-40 bg-paper-50/90 backdrop-blur border-b border-paper-200">
    <nav class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="w-7 h-7 rounded-md bg-ink-900 text-paper-100 grid place-items-center font-bold">读</span>
        <span class="font-semibold">读透 · ReadDeep</span>
      </a>
      <ul class="hidden md:flex items-center gap-6 text-sm text-ink-700">
        <li><a href="library.html"  class="hover:text-accent-500">书库</a></li>
        <li><a href="reader.html"   class="text-accent-500 font-medium">陪读室</a></li>
        <li><a href="workshop.html" class="hover:text-accent-500">笔记工坊</a></li>
      </ul>
      <a href="javascript:void(0)" id="top-go-workshop" class="hidden md:inline-block px-3 py-1.5 text-sm rounded-md bg-accent-500 text-paper-50 hover:bg-accent-600">生成笔记</a>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">

    <!-- ========== 顶部：当前书 / 章节选择 ========== -->
    <section class="mb-6 p-4 md:p-6 rounded-lg border border-paper-200 bg-paper-50">
      <div class="flex flex-col md:flex-row md:items-center gap-4">
        <!-- 当前书 -->
        <div class="flex-1">
          <p class="text-xs text-ink-500 mb-1">当前在读</p>
          <h1 id="current-book-title"
              class="font-semibold"
              style="font-size: var(--text-2xl); line-height: var(--leading-tight)">加载中…</h1>
          <p id="current-book-meta" class="text-xs text-ink-500 mt-1"></p>
        </div>
        <!-- 选书 / 选章 -->
        <div class="flex items-center gap-2">
          <select id="book-select" class="px-3 py-2 text-sm rounded-md border border-ink-300 bg-paper-50 focus:border-ink-900 outline-none">
            <option value="">— 选书 —</option>
          </select>
          <select id="chapter-select" class="px-3 py-2 text-sm rounded-md border border-ink-300 bg-paper-50 focus:border-ink-900 outline-none">
            <option value="">— 选章 —</option>
          </select>
        </div>
      </div>

      <!-- 进度条 -->
      <div class="mt-4">
        <div class="flex items-center justify-between text-xs text-ink-500 mb-1">
          <span>阅读进度</span>
          <span id="progress-text">0 / 0</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-bar-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- ========== 方案 5 最小版：右侧折叠面板加载章节原文 ========== -->
    <section id="chapter-content-wrap" class="mb-6 p-4 md:p-6 rounded-lg border border-paper-200 bg-paper-50">
      <details id="chapter-details">
        <summary class="cursor-pointer text-sm font-semibold flex items-center gap-2"
                 style="font-size: var(--text-xl); line-height: var(--leading-snug)">
          <span>📖</span>
          <span>本章原文（点击展开 / 折叠）</span>
        </summary>
        <article id="chapter-content"
                 class="prose mt-3 text-sm whitespace-pre-wrap"
                 style="font-family: var(--font-serif); line-height: var(--leading-loose); font-size: var(--text-base)"></article>
      </details>
      <!-- D11 块 C：缺章 fallback 占位（默认隐藏，JS 触发显示） -->
      <div id="chapter-missing-fallback" class="reader-missing-chapter" style="display:none;" role="status" aria-live="polite">
        <div class="reader-missing-icon" aria-hidden="true">📖</div>
        <h2 class="reader-missing-title">章节录入中</h2>
        <p class="reader-missing-msg">本书的章节内容正在录入中，请稍后再来。</p>
        <p class="reader-missing-detail">已规划 <span data-mc-total>0</span> 章，当前 0 章可读</p>
        <a href="library.html" class="reader-missing-back">← 返回书库</a>
      </div>
    </section>

    <!-- D11 块 C：缺章 fallback 内联样式（与 style.css token 体系一致） -->
    <style>
      .reader-missing-chapter {
        max-width: 600px;
        margin: 48px auto;
        text-align: center;
        padding: var(--space-8, 2rem) var(--space-6, 1.5rem);
        background: var(--paper-100, #f5e6d3);
        border: 1px solid var(--paper-200, #e8d5b7);
        border-radius: var(--radius-lg, 0.75rem);
        font-family: var(--font-sans, inherit);
        box-sizing: border-box;
      }
      .reader-missing-icon {
        font-size: 56px;
        line-height: 1;
        margin-bottom: var(--space-4, 1rem);
      }
      .reader-missing-title {
        font-size: var(--text-xl, 1.25rem);
        font-weight: var(--weight-semibold, 600);
        margin: 0 0 var(--space-3, 0.75rem);
        color: var(--ink-900, #1a1a1a);
        line-height: var(--leading-snug, 1.35);
      }
      .reader-missing-msg {
        color: var(--ink-700, #3d3d3d);
        line-height: var(--leading-relaxed, 1.65);
        margin: 0 0 var(--space-2, 0.5rem);
        font-size: var(--text-base, 1rem);
      }
      .reader-missing-detail {
        font-size: var(--text-sm, 0.875rem);
        color: var(--ink-500, #737373);
        margin: 0 0 var(--space-6, 1.5rem);
      }
      .reader-missing-back {
        display: inline-block;
        padding: 10px 24px;
        background: var(--ink-900, #1a1a1a);
        color: var(--paper-50, #fafaf7);
        text-decoration: none;
        border-radius: var(--radius-md, 0.5rem);
        font-size: var(--text-sm, 0.875rem);
        transition: background var(--duration-fast, 150ms) var(--ease-out, ease);
      }
      .reader-missing-back:hover {
        background: var(--ink-700, #3d3d3d);
      }
    </style>

    <!-- ========== 4 Agent Tab（D7-2 v2：试试问移出 · 商业级网格）========== -->
    <section class="mb-6">
      <div class="flex items-center gap-3 mb-4">
        <h2 class="font-semibold"
            style="font-size: var(--text-xl); line-height: var(--leading-snug)">4 Agent 陪读</h2>
        <span class="text-xs text-ink-500">（D2 · DeepSeek v4-flash）</span>
      </div>
      <div class="agent-grid">
        <div class="agent-col" data-agent-id="lingdu_ren">
          <button class="agent-card active" data-agent="lingdu_ren" role="tab" aria-selected="true">
            <div class="agent-emoji-frame">📖</div>
            <div class="agent-header">
              <div class="agent-name">领读人</div>
              <div class="agent-persona">拆书匠人</div>
            </div>
            <div class="agent-task">拆结构 · 引原句 · 抛今天就能用的引导问题</div>
          </button>
          <div class="try-ask-list" data-for="lingdu_ren">
            <button class="try-ask-btn" data-ask="这一章主要讲什么？" aria-label="试试问：这一章主要讲什么？">💬 这一章主要讲什么？</button>
            <button class="try-ask-btn" data-ask="作者到底想表达什么？" aria-label="试试问：作者到底想表达什么？">💬 作者到底想表达什么？</button>
          </div>
        </div>
        <div class="agent-col" data-agent-id="sugeladuo">
          <button class="agent-card" data-agent="sugeladuo" role="tab" aria-selected="false">
            <div class="agent-emoji-frame">🤔</div>
            <div class="agent-header">
              <div class="agent-name">苏格拉底</div>
              <div class="agent-persona">追问老头</div>
            </div>
            <div class="agent-task">5Why 扎心追问 · 反向论证 · 戳破假设</div>
          </button>
          <div class="try-ask-list" data-for="sugeladuo">
            <button class="try-ask-btn" data-ask="我说的对吗？追问" aria-label="试试问：我说的对吗？追问">💬 我说的对吗？追问</button>
            <button class="try-ask-btn" data-ask="反过来呢？" aria-label="试试问：反过来呢？">💬 反过来呢？</button>
          </div>
        </div>
        <div class="agent-col" data-agent-id="huashi">
          <button class="agent-card" data-agent="huashi" role="tab" aria-selected="false">
            <div class="agent-emoji-frame">🎨</div>
            <div class="agent-header">
              <div class="agent-name">画师</div>
              <div class="agent-persona">画面搭子</div>
            </div>
            <div class="agent-task">原句作画 · 方块图 · 场景类比 · 今天画</div>
          </button>
          <div class="try-ask-list" data-for="huashi">
            <button class="try-ask-btn" data-ask="给个生活例子" aria-label="试试问：给个生活例子">💬 给个生活例子</button>
            <button class="try-ask-btn" data-ask="画个方块图看看" aria-label="试试问：画个方块图看看">💬 画个方块图看看</button>
          </div>
        </div>
        <div class="agent-col" data-agent-id="jinjubushou">
          <button class="agent-card" data-agent="jinjubushou" role="tab" aria-selected="false">
            <div class="agent-emoji-frame">✍️</div>
            <div class="agent-header">
              <div class="agent-name">金句捕手</div>
              <div class="agent-persona">捞金句的搭子</div>
            </div>
            <div class="agent-task">挑一句 · 引原句 · 写感悟 · 出场景卡</div>
          </button>
          <div class="try-ask-list" data-for="jinjubushou">
            <button class="try-ask-btn" data-ask="挑一句最触动的" aria-label="试试问：挑一句最触动的">💬 挑一句最触动的</button>
            <button class="try-ask-btn" data-ask="给个场景卡" aria-label="试试问：给个场景卡">💬 给个场景卡</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== 对话区 ========== -->
    <section class="mb-6 p-4 md:p-6 rounded-lg border border-paper-200 bg-paper-50">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm text-ink-700">
          当前对话：<span id="current-agent-name" class="font-semibold text-ink-900">领读人</span>
        </p>
        <button id="clear-chat" class="text-xs text-ink-500 hover:text-accent-500">清空对话</button>
      </div>

      <!-- 消息流 -->
      <div id="chat-stream" class="space-y-3 mb-4 max-h-96 overflow-y-auto"></div>

      <!-- 输入区 -->
      <div class="flex gap-2">
        <textarea id="chat-input" rows="2" placeholder="输入你的问题 / 想法 / 想讨论的段落…"
          class="flex-1 px-3 py-2 text-sm rounded-md border border-ink-300 focus:border-ink-900 focus:ring-1 focus:ring-ink-900 outline-none resize-none"></textarea>
        <button id="chat-send" class="px-4 py-2 text-sm rounded-md bg-ink-900 text-paper-100 hover:bg-ink-700 disabled:opacity-50">发送</button>
      </div>
    </section>

    <!-- ========== 章节小结（D14.1 · 替代原思考题） ========== -->
    <section class="mb-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold"
            style="font-size: var(--text-xl); line-height: var(--leading-snug)">章节小结</h2>
        <div class="flex items-center gap-2">
          <span class="text-xs text-ink-500" id="summary-meta">和 4 角色各聊过 1 轮后可生成</span>
          <button id="generate-summary" type="button" disabled
                  class="text-xs px-3 py-1.5 rounded border border-ink-300 text-ink-700 hover:bg-ink-100 hover:border-ink-900 disabled:opacity-50 disabled:cursor-not-allowed"
                  title="基于本轮 4 角色对话生成 500-800 字小结">
            📝 生成小结
          </button>
        </div>
      </div>
      <div id="summary-card" class="hidden p-4 md:p-5 rounded-lg border border-paper-200 bg-paper-50">
        <div id="summary-content" class="text-sm whitespace-pre-wrap" style="font-family: var(--font-serif); line-height: var(--leading-loose)"></div>
        <div class="mt-4 flex items-center gap-2 flex-wrap">
          <button id="regenerate-summary" type="button"
                  class="text-xs px-3 py-1.5 rounded border border-ink-300 text-ink-700 hover:bg-ink-100 hover:border-ink-900">
            🔄 重新生成
          </button>
          <button id="copy-summary" type="button"
                  class="text-xs px-3 py-1.5 rounded border border-ink-300 text-ink-700 hover:bg-ink-100 hover:border-ink-900">
            📋 复制小结
          </button>
          <span id="summary-status" class="text-xs text-ink-500"></span>
        </div>
      </div>
      <div id="summary-loading" class="hidden p-4 md:p-5 rounded-lg border border-paper-200 bg-paper-50 text-center">
        <p class="text-sm text-ink-700">🌀 小结生成中…（最多 30s）</p>
        <p class="text-xs text-ink-500 mt-2">基于 4 角色对话提炼</p>
      </div>
    </section>

    <!-- ========== CTA：去笔记工坊 ========== -->
    <section class="text-center py-8">
      <button id="go-workshop" class="px-8 py-3 rounded-md bg-accent-500 text-paper-50 font-medium hover:bg-accent-600">
        生成笔记 →
      </button>
      <p class="text-xs text-ink-500 mt-3">保存当前进度，跳到笔记工坊选模板</p>
    </section>

  </main>

  <footer class="border-t border-paper-200 py-8 text-center text-xs text-ink-500">
    <p>© 2026 读透（ReadDeep）</p>
  </footer>

  <script src="app.js"></script>
  <script>
    // ===========================================================
    // reader.html 内嵌脚本（v2 · 2026-06-09 荀彧反向检查后整改）
    // 职责：books.json 加载 + 进度条 + 思考题 + Tab 切换 + 去 workshop
    // 不再负责"发送消息"（由 reader.js 的 sendMessage 接管真 API）
    // ===========================================================
    document.addEventListener('DOMContentLoaded', async () => {
      App.init();
      App.track('page_view', { page: 'reader' });

      // 状态
      let currentBook = null;
      let currentChapter = 0;
      let currentAgent = 'lingdu_ren';
      // 暴露给 reader.js 用的 currentBookContext
      window.__readerState = { currentBook: null, currentChapter: 0, get currentBookContext() { return currentBook ? { title: currentBook.title, author: currentBook.author || '佚名', summary: currentBook.summary || '' } : null; } };

      const bookSelectEl = document.getElementById('book-select');
      const chapterSelectEl = document.getElementById('chapter-select');
      const bookTitleEl = document.getElementById('current-book-title');
      const bookMetaEl = document.getElementById('current-book-meta');
      const progressFillEl = document.getElementById('progress-fill');
      const progressTextEl = document.getElementById('progress-text');
      const currentAgentNameEl = document.getElementById('current-agent-name');
      const goWorkshopBtn = document.getElementById('go-workshop');

      // 1. 加载书库（绝对路径，避免 reader.js 重复加载）
      let allBooks = [];
      try {
        const resp = await fetch('/data/books.json');
        const json = await resp.json();
        // 兼容两种格式：{books:[...]} 或直接 [...]
        allBooks = Array.isArray(json) ? json : (json.books || []);
      } catch (e) {
        console.error('[reader] 加载书库失败', e);
        bookTitleEl.textContent = '书库加载失败';
        return;
      }

      // 2. 填充下拉（防止 reader.js 也填：加 marker）
      if (!bookSelectEl.dataset.filled) {
        allBooks.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b.id;
          // cover 可能是 emoji 字符，也可能是图片路径（如 images/covers/xxx.svg）
          // 只有真正是 emoji（1-4 字符的 emoji）才用，否则 fallback 到 📚
          const isEmoji = b.cover && b.cover.length <= 4 && !b.cover.includes('/');
          opt.textContent = `${isEmoji ? b.cover : '📚'} ${b.title}`;
          bookSelectEl.appendChild(opt);
        });
        bookSelectEl.dataset.filled = '1';
      }

      // 3. 处理 ?id=... 入参
      const urlBookId = App.getQueryParam('id');
      const urlChapter = App.getQueryParam('chapter');
      if (urlBookId) {
        const _found = allBooks.find(b => b.id === urlBookId);
        if (_found) {
          bookSelectEl.value = urlBookId;
          loadBook(urlBookId);
          App.track('chapter_read', { bookId: urlBookId, chapter: 0, source: 'deep_link' });
        } else {
          // D11 块 C：?id= 指向不存在的书 → 缺章 fallback
          bookTitleEl.textContent = '未找到该书';
          showChapterFallback({ title: urlBookId, totalPlanned: 0 });
        }
      }

      // 4. 事件
      // D8-2 v3.3 fix-15: 顶部"生成笔记"按钮带当前书和章节跳转
      document.getElementById('top-go-workshop')?.addEventListener('click', (e) => {
        e.preventDefault();
        if (currentBook) {
          const _bookId = encodeURIComponent(currentBook.id);
          const _chapter = currentChapter;
          location.href = `workshop.html?id=${_bookId}&chapter=${_chapter}`;
        } else {
          location.href = 'workshop.html';
        }
      });

      bookSelectEl.addEventListener('change', (e) => {
        if (e.target.value) {
          loadBook(e.target.value);
          App.track('book_select', { bookId: e.target.value, source: 'reader_picker' });
        }
      });

      chapterSelectEl.addEventListener('change', (e) => {
        const prevChapter = currentChapter;  // 记录切前章节
        currentChapter = parseInt(e.target.value, 10) || 0;
        window.__readerState.currentChapter = currentChapter;
        // P2 · 2026-06-10 主公 dogfooding 修复：切章节时清空 chatHistory（仅当前 agent）
        // - 防 LLM 被之前章节对话误导（原 chatHistory 按 bookId 隔离，不按 chapter）
        // - 其他 3 个 agent 历史保留
        // - 立即 save 到 localStorage
        if (prevChapter !== currentChapter && typeof window.__p2ClearChatForCurrentAgent === 'function') {
          window.__p2ClearChatForCurrentAgent();
        }
        // 通知 reader.js 章节变了
        if (typeof window.onChapterChange === 'function') window.onChapterChange(currentChapter);
        updateProgress();
        loadChapterContent();
        // D14.1 · 切章节后刷新"小结可用"状态（reader.js 监听 chatHistory + bookId 变化）
        if (typeof window.onChapterChange === 'function') {
          // reader.js 内的 onChapterChange 会重新统计 + 决定按钮 enable
        }
        if (currentBook) App.track('chapter_read', { bookId: currentBook.id, chapter: currentChapter });
      });

      // 5. 加载单本书
      function loadBook(bookId) {
        currentBook = allBooks.find(b => b.id === bookId);
        if (!currentBook) return;
        window.__readerState.currentBook = currentBook;
        bookTitleEl.textContent = currentBook.title;
        bookMetaEl.textContent = `${currentBook.author || ''} · ${currentBook.category || ''} · 共 ${currentBook.chapters || 1} 章`;
        // 章节下拉
        const totalCh = currentBook.chapters || 1;
        chapterSelectEl.innerHTML = '<option value="">— 选章 —</option>';
        for (let i = 0; i < totalCh; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `第 ${i + 1} 章`;
          chapterSelectEl.appendChild(opt);
        }
        // 恢复进度
        const prog = App.getProgress(bookId);
        currentChapter = prog.chapterIndex || 0;
        // D8-1 v3.1 fix-8: ?chapter= 解析（workshop 返回陪读时携带）
        const _urlChNum = parseInt(urlChapter, 10);
        if (Number.isInteger(_urlChNum) && _urlChNum >= 0 && _urlChNum < totalCh) {
          currentChapter = _urlChNum;
        }
        window.__readerState.currentChapter = currentChapter;
        if (currentChapter < totalCh) chapterSelectEl.value = currentChapter;
        updateProgress();
        loadChapterContent();
      }

      // === 方案 5 · 最小版：右侧折叠面板加载章节原文 ===
      // === D11 块 C：缺章 fallback 辅助函数 ===
      // 切换"原文详情"与"缺章占位"的互斥显示
      function showChapterFallback({ title, totalPlanned }) {
        const wrap = document.getElementById('chapter-content-wrap');
        const details = document.getElementById('chapter-details');
        const fallback = document.getElementById('chapter-missing-fallback');
        if (!wrap || !fallback) return;
        // 隐藏折叠面板主体
        if (details) details.style.display = 'none';
        // 填充文案
        const msgEl = fallback.querySelector('.reader-missing-msg');
        const totalEl = fallback.querySelector('[data-mc-total]');
        if (msgEl) {
          msgEl.textContent = title
            ? `《${title}》的章节内容正在录入中，请稍后再来。`
            : '本书的章节内容正在录入中，请稍后再来。';
        }
        if (totalEl) totalEl.textContent = String(totalPlanned || 0);
        // 展开 fallback
        fallback.style.display = 'block';
        wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function hideChapterFallback() {
        const details = document.getElementById('chapter-details');
        const fallback = document.getElementById('chapter-missing-fallback');
        if (fallback) fallback.style.display = 'none';
        if (details) details.style.display = '';
      }

      async function loadChapterContent() {
        const container = document.getElementById('chapter-content');
        const wrap = document.getElementById('chapter-content-wrap');
        if (!container || !wrap || !currentBook) return;
        // 优先用 currentBook.mdChapters[currentChapter]，否则用 books.json 的 mdPath 字段
        const md = currentBook.mdChapters?.[currentChapter] || currentBook.mdPath;
        // --- D11 块 C 防御性兜底 ---
        // 场景 A：书层没规划章层（mdChapters 缺失或为空）
        if (!md) {
          hideChapterFallback();
          container.innerHTML = '<p class="text-xs text-ink-500">（本书暂无章节正文，可继续陪读对话）</p>';
          return;
        }
        // 加载中：恢复折叠面板 + 清空 fallback
        hideChapterFallback();
        container.innerHTML = '<p class="text-xs text-ink-500">加载中…</p>';
        try {
          const r = await fetch(md);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const txt = await r.text();
          container.textContent = txt;
          // 自动展开
          const details = document.getElementById('chapter-details');
          if (details) details.open = true;
        } catch (e) {
          // --- D11 块 C 缺章 fallback（友好占位）---
          console.warn('[reader] 章节加载失败，进入 fallback', e);
          showChapterFallback({
            title: currentBook.title,
            totalPlanned: (currentBook.mdChapters && currentBook.mdChapters.length) || currentBook.chapters || 0,
          });
        }
      }

      function updateProgress() {
        if (!currentBook) {
          progressFillEl.style.width = '0%';
          progressTextEl.textContent = '0 / 0';
          return;
        }
        const total = currentBook.chapters || 1;
        const done = currentChapter + 1;
        const pct = Math.min(100, Math.round((done / total) * 100));
        progressFillEl.style.width = pct + '%';
        progressTextEl.textContent = `${done} / ${total}（${pct}%）`;
        if (currentBook) {
          App.setProgress(currentBook.id, currentChapter);
        }
      }

      // 6. Agent Tab 切换（aria-selected 同步在 reader.js switchAgent 中处理）
      document.querySelectorAll('.agent-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.agent-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentAgent = btn.dataset.agent;
          currentAgentNameEl.textContent = App.AGENT_NAMES[currentAgent] || currentAgent;
          App.track('agent_chat', { action: 'switch', agent: currentAgent });
        });
      });

      // 7. 发送消息：已由 reader.js 接管
      // 8. 去笔记工坊
      // D14.1 · 思考题已删，goWorkshopBtn 不再需要拼 answers
      goWorkshopBtn.addEventListener('click', () => {
        if (currentBook) {
          App.saveNote({
            bookId: currentBook.id,
            bookTitle: currentBook.title,
            chapter: currentChapter,
            agent: currentAgent,
            template: null,
          });
          App.track('note_generate', { bookId: currentBook.id, chapter: currentChapter, action: 'goto_workshop' });
        }
        const _bookIdParam = currentBook ? encodeURIComponent(currentBook.id) : '';
        const _chapterParam = currentChapter;
        location.href = `workshop.html?bookId=${_bookIdParam}&chapter=${_chapterParam}`;
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] SW registered:', reg.scope))
          .catch(err => console.error('[PWA] SW failed:', err));
      });
    }
  </script>
</body>
</html>
