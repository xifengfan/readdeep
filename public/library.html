<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书库 · 读透（ReadDeep）</title>
  <meta name="description" content="30 本公版书 + 79 本 AI 图书馆 · 选一本开始 AI 陪读。" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    /* ================================================
     * 书库（Library）· 商业级 v3
     * D7-3 吕玲绮：token 化 + 杂志风书卡 + 筛选器视觉优化
     * ================================================ */

    /* ---- 页面标题 ---- */
    .library-title {
      font-size: var(--text-4xl);
      font-weight: var(--weight-bold);
      color: var(--ink-900);
      margin-bottom: var(--space-2);
      letter-spacing: var(--tracking-tight);
    }
    .library-subtitle {
      font-size: var(--text-base);
      color: var(--ink-500);
      margin-bottom: var(--space-6);
    }

    /* ---- 筛选器（Pill style） ---- */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    .filter-label {
      font-size: var(--text-sm);
      color: var(--ink-700);
      margin-right: var(--space-1);
    }
    .filter-btn {
      padding: var(--space-1) var(--space-4);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      border-radius: var(--radius-full);
      border: 1px solid var(--ink-300);
      background: transparent;
      color: var(--ink-700);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
      font-family: inherit;
      line-height: 1.4;
    }
    .filter-btn:hover {
      border-color: var(--ink-900);
      color: var(--ink-900);
    }
    .filter-btn.active {
      background: var(--ink-900);
      border-color: var(--ink-900);
      color: var(--paper-100);
    }

    /* ---- 搜索+分类行 ---- */
    .search-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      max-width: 40rem;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-sm);
      border: 1px solid var(--ink-300);
      border-radius: var(--radius-md);
      background: var(--paper-50);
      color: var(--ink-900);
      outline: none;
      transition: border-color var(--duration-fast) var(--ease-out),
                  box-shadow var(--duration-fast) var(--ease-out);
      font-family: inherit;
    }
    .search-input:focus {
      border-color: var(--ink-900);
      box-shadow: 0 0 0 2px rgba(26,26,26,0.08);
    }
    .search-input::placeholder {
      color: var(--ink-500);
    }
    .category-select {
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-sm);
      border: 1px solid var(--ink-300);
      border-radius: var(--radius-md);
      background: var(--paper-50);
      color: var(--ink-900);
      outline: none;
      cursor: pointer;
      font-family: inherit;
      transition: border-color var(--duration-fast) var(--ease-out);
    }
    .category-select:focus {
      border-color: var(--ink-900);
      box-shadow: 0 0 0 2px rgba(26,26,26,0.08);
    }

    /* ---- 结果计数 ---- */
    .result-count {
      font-size: var(--text-xs);
      color: var(--ink-500);
      margin-top: var(--space-3);
    }
    .result-count-icon {
      margin-right: var(--space-1);
    }

    /* ---- 书籍网格 ---- */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-4);
    }
    @media (min-width: 768px) {
      .books-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (min-width: 1024px) {
      .books-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* ================================================
     * 书卡（杂志风 · 商业级）
     * ================================================ */
    .book-card {
      display: flex;
      flex-direction: column;
      background-color: var(--paper-50);
      border: 1px solid var(--paper-200);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform var(--duration-base) var(--ease-out),
                  box-shadow var(--duration-base) var(--ease-out),
                  border-color var(--duration-base) var(--ease-out);
      cursor: pointer;
      text-decoration: none;
      color: var(--ink-900);
      height: 100%;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--ink-900);
    }

    .book-card__cover {
      position: relative;
      aspect-ratio: 3 / 4;
      background-color: var(--paper-100);
      overflow: hidden;
    }
    .book-card__cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .book-card__badge {
      position: absolute;
      top: var(--space-3);
      left: var(--space-3);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-full);
      background-color: var(--paper-50);
      color: var(--ink-900);
      box-shadow: var(--shadow-sm);
      line-height: 1.2;
    }
    .book-card__badge--lord {
      background-color: var(--ink-900);
      color: var(--paper-100);
    }

    .book-card__body {
      padding: var(--space-5) var(--space-5) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      flex: 1;
      min-height: 0;
    }

    .book-card__title {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      line-height: 1.35;
      color: var(--ink-900);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
      min-height: 2.7em;
      letter-spacing: 0;
    }

    .book-card__meta {
      font-size: var(--text-xs);
      color: var(--ink-500);
      margin: 0;
      line-height: 1.4;
    }

    .book-card__summary {
      font-size: var(--text-sm);
      color: var(--ink-700);
      line-height: var(--leading-normal);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
      flex: 1;
      min-height: 2.7em;
    }

    .book-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: var(--space-3);
      border-top: 1px solid var(--paper-200);
      font-size: var(--text-xs);
      color: var(--ink-500);
      margin-top: var(--space-1);
    }

    .book-card__chapters {
      font-weight: var(--weight-medium);
      color: var(--ink-700);
    }

    .book-card__difficulty {
      color: var(--ink-500);
    }

    /* B4-7: wikilink chip · D9 v5 主公陪读笔记关联展示位 */
    .book-card__wikilinks {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
      margin-top: calc(-1 * var(--space-1));
    }
    .book-card__chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      line-height: 1.3;
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
      background-color: var(--ink-900);
      color: var(--paper-100);
      letter-spacing: 0.01em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ================================================
     * 骨架屏 · Loading Skeleton
     * ================================================ */
    .book-card--skeleton {
      pointer-events: none;
    }
    .book-card--skeleton .book-card__cover {
      background: linear-gradient(110deg, var(--paper-100) 30%, var(--paper-200) 50%, var(--paper-100) 70%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s ease-in-out infinite;
    }
    .book-card--skeleton .book-card__body {
      gap: var(--space-3);
    }
    .skeleton-line {
      height: 14px;
      border-radius: var(--radius-sm);
      background: linear-gradient(110deg, var(--paper-100) 30%, var(--paper-200) 50%, var(--paper-100) 70%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s ease-in-out infinite;
    }
    .skeleton-line--short {
      width: 60%;
    }
    .skeleton-line--medium {
      width: 80%;
    }
    .skeleton-line--micro {
      height: 10px;
      width: 40%;
    }

    @keyframes skeleton-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ================================================
     * 空状态
     * ================================================ */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-16) var(--space-4);
      text-align: center;
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: var(--space-4);
      opacity: 0.6;
    }
    .empty-state svg {
      width: 120px;
      height: 120px;
      margin-bottom: var(--space-4);
      opacity: 0.5;
    }
    .empty-state-title {
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--ink-700);
      margin-bottom: var(--space-2);
    }
    .empty-state-desc {
      font-size: var(--text-sm);
      color: var(--ink-500);
      max-width: 300px;
    }

    /* ================================================
     * Header 行内定义
     * (复用 reader/workshop D7-2 样式)
     * ================================================ */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(250,250,247,0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--paper-200);
    }
    .site-nav {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 var(--space-4);
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      text-decoration: none;
      color: var(--ink-900);
    }
    .site-logo-mark {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-md);
      background: var(--ink-900);
      color: var(--paper-100);
      display: grid;
      place-items: center;
      font-weight: var(--weight-bold);
      font-size: var(--text-sm);
    }
    .site-logo-text {
      font-weight: var(--weight-semibold);
      font-size: var(--text-base);
    }
    .site-nav-links {
      display: none;
      align-items: center;
      gap: var(--space-6);
      font-size: var(--text-sm);
      color: var(--ink-700);
    }
    @media (min-width: 768px) {
      .site-nav-links {
        display: flex;
      }
    }
    .site-nav-links a {
      text-decoration: none;
      color: var(--ink-700);
      transition: color var(--duration-fast) var(--ease-out);
    }
    .site-nav-links a:hover {
      color: var(--accent-500);
    }
    .site-nav-links a.active {
      color: var(--accent-500);
      font-weight: var(--weight-medium);
    }
    .site-cta {
      display: none;
      padding: var(--space-1) var(--space-3);
      font-size: var(--text-sm);
      border-radius: var(--radius-md);
      background: var(--ink-900);
      color: var(--paper-100);
      text-decoration: none;
      transition: background var(--duration-fast) var(--ease-out);
    }
    .site-cta:hover {
      background: var(--ink-700);
    }
    @media (min-width: 768px) {
      .site-cta {
        display: inline-block;
      }
    }
    .site-footer {
      border-top: 1px solid var(--paper-200);
      padding: var(--space-8) 0;
      text-align: center;
      font-size: var(--text-xs);
      color: var(--ink-500);
    }
  </style>
</head>
<body class="paper">

  <header class="site-header">
    <nav class="site-nav">
      <a href="index.html" class="site-logo">
        <span class="site-logo-mark">读</span>
        <span class="site-logo-text">读透 · ReadDeep</span>
      </a>
      <ul class="site-nav-links">
        <li><a href="library.html" class="active">书库</a></li>
        <li><a href="reader.html">陪读室</a></li>
        <li><a href="workshop.html">笔记工坊</a></li>
      </ul>
      <a href="reader.html" class="site-cta">陪读室</a>
    </nav>
  </header>

  <main style="max-width:72rem;margin:0 auto;padding:var(--space-12) var(--space-4);">

    <!-- ========== 头部：筛选 ========== -->
    <div style="margin-bottom:var(--space-10);">
      <h1 class="library-title">书库</h1>
      <p class="library-subtitle">30 本公版书 + 79 本 AI 图书馆 · 选一本开始陪读</p>

      <!-- 筛选器 -->
      <div class="filter-bar">
        <span class="filter-label">筛选：</span>
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="public_domain">公版书（30）</button>
        <button class="filter-btn" data-filter="ai_library">AI 图书馆（79）</button>
      </div>

      <!-- 搜索框 + 分类下拉 -->
      <div class="search-row">
        <input id="search-input" type="search" placeholder="搜索书名 / 作者 / 分类…" class="search-input" />
        <select id="category-select" class="category-select">
          <option value="">全部分类</option>
        </select>
      </div>

      <p id="result-count" class="result-count"><span class="result-count-icon">📚</span>— 加载中…</p>
    </div>

    <!-- ========== 书籍网格 ========== -->
    <div id="books-grid" class="books-grid">
      <!-- 骨架屏 · 加载中占位 -->
      <div class="book-card book-card--skeleton">
        <div class="book-card__cover"></div>
        <div class="book-card__body">
          <div class="skeleton-line skeleton-line--short"></div>
          <div class="skeleton-line skeleton-line--micro"></div>
          <div class="skeleton-line skeleton-line--medium"></div>
          <div class="skeleton-line skeleton-line--micro" style="margin-top:auto;"></div>
        </div>
      </div>
      <div class="book-card book-card--skeleton">
        <div class="book-card__cover"></div>
        <div class="book-card__body">
          <div class="skeleton-line skeleton-line--short"></div>
          <div class="skeleton-line skeleton-line--micro"></div>
          <div class="skeleton-line skeleton-line--medium"></div>
          <div class="skeleton-line skeleton-line--micro" style="margin-top:auto;"></div>
        </div>
      </div>
      <div class="book-card book-card--skeleton">
        <div class="book-card__cover"></div>
        <div class="book-card__body">
          <div class="skeleton-line skeleton-line--short"></div>
          <div class="skeleton-line skeleton-line--micro"></div>
          <div class="skeleton-line skeleton-line--medium"></div>
          <div class="skeleton-line skeleton-line--micro" style="margin-top:auto;"></div>
        </div>
      </div>
      <div class="book-card book-card--skeleton">
        <div class="book-card__cover"></div>
        <div class="book-card__body">
          <div class="skeleton-line skeleton-line--short"></div>
          <div class="skeleton-line skeleton-line--micro"></div>
          <div class="skeleton-line skeleton-line--medium"></div>
          <div class="skeleton-line skeleton-line--micro" style="margin-top:auto;"></div>
        </div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <p>© 2026 读透（ReadDeep）</p>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      App.init();
      App.track('page_view', { page: 'library' });

      const grid = document.getElementById('books-grid');
      const countEl = document.getElementById('result-count');
      const searchInput = document.getElementById('search-input');
      const categorySelect = document.getElementById('category-select');
      const filterBtns = document.querySelectorAll('.filter-btn');

      let allBooks = [];
      let currentFilter = 'all';
      let currentSearch = '';
      let currentCategory = '';

      // 1. 加载数据
      try {
        const resp = await fetch('data/books.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const json = await resp.json();
        allBooks = json.books || [];
        // 填充分类下拉
        const cats = [...new Set(allBooks.map(b => b.category).filter(Boolean))].sort();
        cats.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          categorySelect.appendChild(opt);
        });
        countEl.innerHTML = '<span class="result-count-icon">📚</span>共 ' + allBooks.length + ' 本';
      } catch (e) {
        console.error('[library] 加载失败', e);
        grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">书库加载失败</div><div class="empty-state-desc">请刷新重试</div></div>';
        countEl.innerHTML = '<span class="result-count-icon">📚</span>加载失败';
        return;
      }

      // 2. 渲染
      function render() {
        let list = allBooks;
        // B4-4: 改用 id 前缀过滤（避免 lord_read 永远 0 命中的死按钮 bug）
        if (currentFilter !== 'all') {
          list = list.filter(b => {
            if (currentFilter === 'public_domain') return b.id.startsWith('pd-');
            if (currentFilter === 'ai_library') return b.id.startsWith('ai-');
            return true;
          });
        }
        if (currentCategory) {
          list = list.filter(b => b.category === currentCategory);
        }
        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          list = list.filter(b =>
            (b.title || '').toLowerCase().includes(q) ||
            (b.author || '').toLowerCase().includes(q) ||
            (b.category || '').toLowerCase().includes(q)
          );
        }

        const tags = [];
        // B4-5: 计数标签同步"AI 图书馆"
        if (currentFilter !== 'all') tags.push(currentFilter === 'public_domain' ? '公版' : currentFilter === 'ai_library' ? 'AI 图书馆' : '');
        if (currentCategory) tags.push(currentCategory);
        if (currentSearch) tags.push('搜索"' + currentSearch + '"');
        countEl.innerHTML = '<span class="result-count-icon">📚</span>共 ' + list.length + ' 本' + (tags.length ? '（' + tags.join(' · ') + '）' : '');

        if (list.length === 0) {
          grid.innerHTML = '<div class="empty-state"><svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="25" width="80" height="60" rx="4" stroke="#737373" stroke-width="2" fill="#f5e6d3"/><line x1="35" y1="45" x2="85" y2="45" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"/><line x1="35" y1="55" x2="75" y2="55" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"/><line x1="35" y1="65" x2="65" y2="65" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"/><circle cx="60" cy="100" r="6" fill="#c1272d" opacity="0.3"/><circle cx="48" cy="106" r="4" fill="#c1272d" opacity="0.2"/><circle cx="72" cy="106" r="4" fill="#c1272d" opacity="0.2"/></svg><div class="empty-state-title">没有匹配的书</div><div class="empty-state-desc">试试其他关键词或分类</div></div>';
          return;
        }

        grid.innerHTML = list.map(function(b) {
          // B4-6 + B4-8: badge 改用 id 前缀；ai-* 缺字段 fallback
          var isAI = b.id.startsWith('ai-');
          var badgeText = isAI ? 'AI 图书馆' : '公版';
          var badgeClass = 'book-card__badge' + (isAI ? ' book-card__badge--lord' : '');
          // B4-8: ai-* fallback 字段
          var coverHtml;
          if (b.cover) {
            coverHtml = '<img src="' + b.cover + '" alt="' + escapeHtml(b.title) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div style=display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:2.5rem;>📚</div>\';" />';
          } else if (isAI) {
            // ai-* 统一占位封面：黑底 + 📖 + ID
            coverHtml = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%);color:#fafaf7;font-size:1.75rem;letter-spacing:0.05em;font-weight:600;gap:0.25rem;"><span style="font-size:2.5rem;">📖</span><span style="font-size:0.7rem;opacity:0.7;">' + escapeHtml(b.id) + '</span></div>';
          } else {
            coverHtml = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:2.5rem;">📚</div>';
          }
          // B4-8: summary fallback
          var summaryText;
          if (b.summary) {
            summaryText = b.summary;
          } else if (isAI) {
            var dateBit = (b.recommendDate || '').slice(0, 10);
            summaryText = '分类：' + (b.category || '未分类') + (dateBit ? ' · 推荐 ' + dateBit : '');
          } else {
            summaryText = '';
          }
          // B4-8: chapters fallback
          var chaptersText = b.chapters != null ? b.chapters + ' 章' : '—';
          // B4-8: difficulty fallback
          var difficultyText = b.difficulty || (isAI ? '未分级' : '—');
          // B4-7: wikilink chip（D9 v5 主公陪读笔记卖点）
          var wikilinkChips = '';
          if (Array.isArray(b.wikilinks) && b.wikilinks.length > 0) {
            var chips = b.wikilinks.slice(0, 2).map(function(w) {
              return '<span class="book-card__chip">📖 ' + escapeHtml(w) + '</span>';
            }).join('');
            wikilinkChips = '<div class="book-card__wikilinks">' + chips + '</div>';
          }
          return '<a href="book.html?id=' + b.id + '" class="book-card" data-id="' + b.id + '">' +
            '<div class="book-card__cover">' +
              coverHtml +
              '<span class="' + badgeClass + '">' + badgeText + '</span>' +
            '</div>' +
            '<div class="book-card__body">' +
              '<h3 class="book-card__title">' + escapeHtml(b.title) + '</h3>' +
              '<p class="book-card__meta">' + escapeHtml(b.author || '') + ' · ' + escapeHtml(b.category || '') + '</p>' +
              '<p class="book-card__summary">' + escapeHtml(summaryText) + '</p>' +
              wikilinkChips +
              '<div class="book-card__footer">' +
                '<span class="book-card__chapters">' + chaptersText + '</span>' +
                '<span class="book-card__difficulty">' + escapeHtml(difficultyText) + '</span>' +
              '</div>' +
            '</div>' +
          '</a>';
        }).join('');

        // 埋点：选书
        grid.querySelectorAll('.book-card').forEach(function(el) {
          el.addEventListener('click', function() {
            App.track('book_select', { bookId: el.dataset.id, source: 'library_grid' });
          });
        });
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 3. 事件
      filterBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          filterBtns.forEach(function(b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          App.track('library_filter', { filter: currentFilter });
          render();
        });
      });

      var searchTimer;
      searchInput.addEventListener('input', function(e) {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
          currentSearch = e.target.value.trim();
          render();
        }, 200);
      });

      categorySelect.addEventListener('change', function(e) {
        currentCategory = e.target.value;
        App.track('library_filter', { category: currentCategory });
        render();
      });

      render();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] SW registered:', reg.scope))
          .catch(err => console.error('[PWA] SW failed:', err));
      });
    }
  </script>
</body>
</html>
