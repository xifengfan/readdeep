<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600">
  <defs>
    <style><![CDATA[
      .t-mega    { font: 900 160px/1 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 4px; }
      .t-mega2   { font: 900 140px/1 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 4px; }
      .t-h1-sm   { font: 900 80px/1  -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 2px; }
      .t-h2      { font: 900 72px/1  -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 2px; }
      .t-h2-sm   { font: 900 60px/1  -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 2px; }
      .t-h3      { font: 800 56px/1  -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 1px; }
      .t-h3-sm   { font: 800 48px/1  -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 1px; }
      .t-sub     { font: 600 36px/1  -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 1px; }
      .t-title-en{ font: 800 48px/1 "Inter", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 1px; }
      .t-brand   { font: 700 11px/1 "Inter", "Segoe UI", system-ui, sans-serif; letter-spacing: 3px; }
      .t-tag     { font: 700 10px/1 "Inter", "Segoe UI", system-ui, sans-serif; letter-spacing: 2px; }
      .t-foot    { font: 500 12px/1 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 1px; }
      .t-num     { font: 700 13px/1 "Inter", "Segoe UI", system-ui, sans-serif; font-feature-settings: "tnum"; letter-spacing: 1px; }
    ]]></style>
  </defs>

  <rect width="440" height="600" fill="#1a2d1f"/>
  <rect class="bg-bar-fix" x="0" y="0" width="440" height="6" fill="#d49a10"/>

  <rect x="60" y="80" width="32" height="2" fill="#fbbf24"/>
  <text class="t-brand" x="60" y="100" fill="#8aa088" opacity="0.85">READ DEEP</text>
  <text class="t-tag"   x="60" y="116" fill="#8aa088" opacity="0.6">读  透</text>
  <text class="t-tag"   x="380" y="100" fill="#fbbf24" text-anchor="end">陪读笔记</text>

  <line x1="60" y1="170" x2="380" y2="170" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>

  <text class="t-h3" x="60" y="220" fill="#e8f5e8">穷查理宝</text>
<text class="t-h3" x="60" y="300" fill="#e8f5e8">典精读</text>

  <line x1="60" y1="420" x2="380" y2="420" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>

  <text class="t-foot" x="60" y="445" fill="#8aa088" opacity="0.9">佚名</text>
  <text class="t-foot" x="380" y="445" fill="#8aa088" opacity="0.7" text-anchor="end">财富与认知</text>

  <text class="t-num" x="60"  y="540" fill="#fbbf24">LORD-012</text>
  <text class="t-foot" x="380" y="540" fill="#8aa088" opacity="0.5" text-anchor="end">No. 02</text>

  <rect x="0" y="594" width="440" height="6" fill="#d49a10"/>
</svg>