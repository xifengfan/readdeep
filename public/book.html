<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书详情 · 读透（ReadDeep）</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>
<body>

  <!-- ========== 顶部导航 ========== -->
  <header class="site-header">
    <nav class="site-nav">
      <a href="index.html" class="site-logo">
        <span class="site-logo__icon">读</span>
        <span class="site-logo__text">读透 · ReadDeep</span>
      </a>
      <ul class="site-nav__links">
        <li><a href="library.html">书库</a></li>
        <li><a href="reader.html">陪读室</a></li>
        <li><a href="workshop.html">笔记工坊</a></li>
      </ul>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-12">
    <!-- ========== 书籍详情（双栏：封面 + 元数据）========== -->
    <div class="book-detail">
      <div class="book-detail__cover" id="book-cover">📚</div>
      <div class="book-detail__body">
        <h1 id="book-title">加载中…</h1>
        <p id="book-meta"></p>
        <p id="book-summary"></p>
        <div class="book-detail__cta">
          <a id="btn-read" href="reader.html" class="btn btn-primary">开始陪读</a>
          <a href="library.html" class="btn btn-secondary">返回书库</a>
        </div>
      </div>
    </div>

    
  <!-- ========== 本书 3 个亮点（替换原 4 Agent）========== -->
    <section class="book-preview">
      <div class="book-preview__head">
        <h2 class="book-preview__title">3 个亮点 · 一眼看懂这本书</h2>
        <p class="book-preview__sub">静态预览 · 基于本书元数据</p>
      </div>
      <div class="book-preview__grid" id="book-preview-grid">
        <!-- JS 动态渲染 -->
      </div>
      <div class="book-preview__cta">
        <a id="btn-read-bottom" href="#" class="btn btn-primary">开始陪读 →</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 读透（ReadDeep）</p>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      App.init();
      App.track('page_view', { page: 'book_detail' });

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      const bookId = App.getQueryParam('id');
      const coverEl = document.getElementById('book-cover');
      const titleEl = document.getElementById('book-title');
      const metaEl = document.getElementById('book-meta');
      const summaryEl = document.getElementById('book-summary');
      const btnRead = document.getElementById('btn-read');

      if (!bookId) {
        titleEl.textContent = '未指定书';
        summaryEl.textContent = '请从书库选一本书进入。';
        btnRead.style.display = 'none';
        return;
      }

      try {
        const resp = await fetch('data/books.json');
        const json = await resp.json();
        const book = (json.books || []).find(b => b.id === bookId);
        if (!book) {
          titleEl.textContent = '书不存在';
          summaryEl.textContent = `找不到 id=${bookId} 的书`;
          btnRead.style.display = 'none';
          return;
        }
        // 封面：用 <img> 标签渲染 SVG（修复 textContent 只能显示文件路径的 bug）
        if (book.cover) {
          coverEl.innerHTML = `<img src="${book.cover}" alt="${escapeHtml(book.title)}" class="book-cover-img" loading="lazy" decoding="async" style="display: block;" />`;
        } else {
          coverEl.textContent = '📚';
        }
        titleEl.textContent = book.title;
        const sourceMap = { public_domain: '公版书', lord_read: '主公已读' };
        metaEl.textContent = `${book.author || '佚名'} · ${book.category || ''} · ${sourceMap[book.source] || book.source || ''} · ${book.chapters || 1} 章 · ${book.difficulty || '入门'}`;

      // ---- 本书 3 亮点渲染（替换原 4 Agent）----
      const previewGrid = document.getElementById('book-preview-grid');
      if (previewGrid && book) {
        const catMap = {
          '国学经典': '东方智慧，千年沉淀',
          '文学经典': '字字珠玑，篇篇锦绣',
          '历史经典': '以史为鉴，知兴替',
          '蒙学经典': '启蒙养正，童蒙养性',
          '哲学经典': '叩问本质，思辨人生',
          '已读笔记': '主公读书沉淀',
          '主公读书法': '原创读书方法论',
        };
        const cat = catMap[book.category] || '值得一读的经典';

        const cards = [
          {
            key: 'essence',
            label: '核心定位',
            heading: book.title,
            body: book.summary || '经典传世，启迪心智。',
            quote: '— ' + (book.author || '佚名')
          },
          {
            key: 'socrates',
            label: '反常识视角',
            heading: book.category || '经典',
            body: cat,
            quote: '若不读此书，' + (book.difficulty || '入门') + '之上的视野从何而来？'
          },
          {
            key: 'painter',
            label: '意象联想',
            heading: (book.chapters || 0) + ' 章',
            body: '想象古人伏案，' + book.title + ' 在油灯下徐徐展开。',
            quote: '— 画师视角'
          }
        ];

        previewGrid.innerHTML = cards.map(c =>
          `<div class="preview-card" data-key="${c.key}">
            <div class="preview-card__label">${escapeHtml(c.label)}</div>
            <div class="preview-card__heading">${escapeHtml(c.heading)}</div>
            <div class="preview-card__body">${escapeHtml(c.body)}</div>
            <div class="preview-card__quote">${escapeHtml(c.quote)}</div>
          </div>`
        ).join('');

        const btnBottom = document.getElementById('btn-read-bottom');
        if (btnBottom) {
          btnBottom.href = 'reader.html?id=' + encodeURIComponent(bookId);
        }
      }
        summaryEl.textContent = book.summary || '';
        btnRead.href = `reader.html?id=${book.id}`;
        App.track('book_select', { bookId: book.id, source: 'detail_page' });
      } catch (e) {
        console.error('[book] 加载失败', e);
        titleEl.textContent = '加载失败';
        summaryEl.textContent = '请刷新重试';
      }


  });
  </script>

  <style>
    /* ---- 页面基本 ---- */
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background-color: var(--paper-50);
      color: var(--ink-900);
      line-height: var(--leading-relaxed);
    }

    /* ---- 导航（复用 reader/library 风格） ---- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--paper-50);
      border-bottom: 1px solid var(--paper-200);
      backdrop-filter: blur(8px);
    }
    .site-nav {
      max-width: 75rem;
      margin: 0 auto;
      padding: 0 var(--space-4);
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      text-decoration: none;
      color: inherit;
    }
    .site-logo__icon {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: var(--radius-md);
      background: var(--ink-900);
      color: var(--paper-100);
      display: grid;
      place-items: center;
      font-weight: var(--weight-bold);
      font-size: 0.875rem;
    }
    .site-logo__text {
      font-weight: var(--weight-semibold);
    }
    .site-nav__links {
      display: none;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: var(--space-6);
      font-size: var(--text-sm);
      color: var(--ink-700);
    }
    .site-nav__links a {
      color: var(--ink-700);
      text-decoration: none;
      transition: color var(--duration-fast) var(--ease-out);
    }
    .site-nav__links a:hover {
      color: var(--accent-500);
    }
    @media (min-width: 768px) {
      .site-nav__links { display: flex; }
    }

    /* ---- 书籍详情（双栏：封面 + 元数据） ---- */
    .max-w-5xl { max-width: 64rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .px-4 { padding-left: var(--space-4); padding-right: var(--space-4); }
    .py-12 { padding-top: var(--space-12); padding-bottom: var(--space-12); }

    .book-detail {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-8);
      padding: var(--space-8);
      background-color: var(--paper-50);
      border: 1px solid var(--paper-200);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-8);
    }

    .book-detail__cover {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-size: 4rem;
    }

    .book-detail__cover img,
    .book-cover-img {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--paper-200);
    }

    .book-detail__body h1 {
      font-size: var(--text-3xl);
      font-weight: var(--weight-bold);
      color: var(--ink-900);
      margin-bottom: var(--space-2);
      line-height: var(--leading-snug);
    }

    .book-detail__body #book-meta {
      font-size: var(--text-sm);
      color: var(--ink-500);
      margin-bottom: var(--space-4);
    }

    .book-detail__body #book-summary {
      font-size: var(--text-base);
      color: var(--ink-700);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-6);
    }

    .book-detail__cta {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    /* ---- 按钮系统 ---- */
    .btn {
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-md);
      font-weight: var(--weight-medium);
      transition: all var(--duration-base) var(--ease-out);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: var(--text-sm);
    }
    .btn-primary {
      background-color: var(--ink-900);
      color: var(--paper-100);
    }
    .btn-primary:hover {
      background-color: var(--ink-700);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary {
      background-color: var(--paper-50);
      color: var(--ink-700);
      border: 1px solid var(--ink-300);
    }
    .btn-secondary:hover {
      border-color: var(--ink-900);
      color: var(--ink-900);
    }

    /* ---- Agent 介绍（D7-5：与 reader.html 一致，+试试问） ---- */
    .agent-intro {
      margin-bottom: var(--space-8);
    }
    .agent-intro__head {
      margin-bottom: var(--space-4);
    }
    .agent-intro__title {
      font-size: var(--text-xl);
      font-weight: var(--weight-semibold);
      color: var(--ink-900);
      margin-bottom: var(--space-1);
      line-height: var(--leading-snug);
    }
    .agent-intro__sub {
      font-size: var(--text-sm);
      color: var(--ink-500);
    }
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-3);
      align-items: stretch;
      grid-auto-rows: 1fr;
      min-width: 0;
      overflow: visible;
    }
    @media (min-width: 768px) {
      .agent-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .agent-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: var(--space-2);
      padding: var(--space-4);
      background-color: var(--paper-50);
      border: 1px solid var(--paper-200);
      border-left: 4px solid transparent;
      border-radius: var(--radius-md);
      text-align: left;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out);
      height: 100%;
      min-height: 240px;
      font-family: inherit;
      color: var(--ink-900);
      max-width: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }
    .agent-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--ink-900);
    }
    .agent-card[data-agent="lingdu_ren"]  { border-left-color: var(--agent-lead); }
    .agent-card[data-agent="sugeladuo"]   { border-left-color: var(--agent-socrates); }
    .agent-card[data-agent="huashi"]      { border-left-color: var(--agent-painter); }
    .agent-card[data-agent="jinjubushou"] { border-left-color: var(--agent-quote); }
    .agent-emoji-frame {
      font-size: var(--text-2xl);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--paper-100);
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }
    .agent-body {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      flex: 1;
      min-height: 0;
    }
    .agent-name {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--ink-900);
    }
    .agent-persona {
      font-size: var(--text-xs);
      color: var(--ink-500);
    }
    .agent-task {
      font-size: var(--text-sm);
      color: var(--ink-700);
      line-height: var(--leading-normal);
      min-height: 2.7em;
    }
    .try-ask-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      padding-top: var(--space-3);
      border-top: 1px solid var(--paper-200);
      margin-top: auto;
    }
    .try-ask-btn {
      font-size: var(--text-xs);
      padding: var(--space-1) var(--space-3);
      background-color: var(--paper-100);
      color: var(--ink-900);
      border: 1px solid var(--paper-200);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
      font-family: inherit; text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }
    .try-ask-btn:hover {
      background-color: var(--ink-900);
      color: var(--paper-100);
      border-color: var(--ink-900);
    }
    .try-ask {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
      padding-top: var(--space-2);
      border-top: 1px solid var(--paper-200);
      min-width: 0;
      max-width: 100%;
    }

    /* ---- Footer ---- */
    .site-footer {
      border-top: 1px solid var(--paper-200);
      padding: var(--space-8) 0;
      text-align: center;
      font-size: var(--text-xs);
      color: var(--ink-500);
    }

    /* ---- 响应式（移动端单列） ---- */
    @media (max-width: 768px) {
      .book-detail {
        grid-template-columns: 1fr;
        text-align: center;
        padding: var(--space-6);
      }
      .book-detail__cover {
        justify-content: center;
      }
      .book-detail__cta {
        justify-content: center;
      }
    }
  
    /* ---- 本书 3 亮点 ---- */
    .book-preview {
      margin-top: var(--space-12);
      padding-top: var(--space-8);
      border-top: 1px solid var(--paper-200);
    }
    .book-preview__head { margin-bottom: var(--space-6); }
    .book-preview__title {
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--ink-900);
      margin-bottom: var(--space-2);
    }
    .book-preview__sub {
      font-size: var(--text-sm);
      color: var(--text-2);
    }
    .book-preview__grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    .preview-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 100%;
      gap: var(--space-2);
      padding: var(--space-5);
      background-color: var(--paper-50);
      border: 1px solid var(--paper-200);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius-md);
      min-height: 200px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .preview-card__label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .preview-card__heading {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--ink-900);
      line-height: 1.3;
    }
    .preview-card__body {
      font-size: var(--text-base);
      color: var(--ink-700);
      line-height: 1.6;
      flex: 1;
    }
    .preview-card__quote {
      font-size: var(--text-sm);
      color: var(--text-2);
      font-style: italic;
      padding-left: var(--space-3);
      border-left: 2px solid var(--accent);
    }
    .book-preview__cta {
      text-align: center;
      padding-top: var(--space-6);
    }
    .preview-card[data-key="essence"]   { --accent: var(--agent-lead); }
    .preview-card[data-key="socrates"]  { --accent: var(--agent-socrates); }
    .preview-card[data-key="painter"]   { --accent: var(--agent-painter); }
    @media (max-width: 768px) {
      .book-preview__grid { grid-template-columns: 1fr; }
    }
</style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] SW registered:', reg.scope))
          .catch(err => console.error('[PWA] SW failed:', err));
      });
    }
  </script>
</body>
</html>
