<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>笔记工坊 · 读透（ReadDeep）</title>
  <meta name="description" content="4 种模板 · 1 键生成公众号 / 小红书 / 思维导图 / 卡片分享。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          ink:    { 900: '#1a1a1a', 700: '#3d3d3d', 500: '#737373', 300: '#d4d4d3', 100: '#f5f5f5' },
          paper:  { 50: '#fafaf7', 100: '#f5e6d3', 200: '#e8d5b7' },
          accent: { 500: '#c1272d', 600: '#a11f25' },
        },
        fontFamily: { sans: ['"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'] }
      }}
    }
  </script>
</head>
<body class="bg-paper-50 text-ink-900 font-sans antialiased paper">

  <header class="sticky top-0 z-40 bg-paper-50/90 backdrop-blur border-b border-paper-200">
    <nav class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="w-7 h-7 rounded-md bg-ink-900 text-paper-100 grid place-items-center font-bold">读</span>
        <span class="font-semibold">读透 · ReadDeep</span>
      </a>
      <ul class="hidden md:flex items-center gap-6 text-sm text-ink-700">
        <li><a href="library.html"  class="hover:text-accent-500">书库</a></li>
        <li><a href="reader.html"   class="hover:text-accent-500">陪读室</a></li>
        <li><a href="workshop.html" class="text-accent-500 font-medium">笔记工坊</a></li>
      </ul>
      <a href="reader.html" class="hidden md:inline-block px-3 py-1.5 text-sm rounded-md border border-ink-300 hover:border-ink-900">返回陪读室</a>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-12">

    <!-- ========== 头部：上下文 ========== -->
    <div class="mb-10">
      <h1 class="text-3xl md:text-4xl font-bold mb-2">笔记工坊</h1>
      <p class="text-ink-500 mb-4">把陪读室的内容，1 键变成可发布的笔记</p>
      <div id="context-info" class="text-sm text-ink-700 p-3 rounded-md bg-paper-100 border border-paper-200">
        当前：<span class="font-semibold">未关联到具体章节</span> · <a href="reader.html" class="text-accent-500 hover:underline">去陪读室选书选章</a>
      </div>
    </div>

    <!-- ========== 4 种模板 ========== -->
    <section class="mb-10">
      <h2 class="text-lg font-semibold mb-4">选一种模板生成</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button class="template-card" data-template="wechat_article">
          <span class="icon">📝</span>
          <div class="title">公众号长文</div>
          <p class="desc">基于 DeepSeek 生成 1500-2500 字深度长文，结构完整，可直接发布到公众号。</p>
          <p class="text-xs text-ink-500 mt-2">适用：知识博主 / 深度分享 · <span class="text-accent-500">→ action=note</span></p>
        </button>
        <button class="template-card" data-template="xhs_6frame">
          <span class="icon">📱</span>
          <div class="title">小红书 6 帧图文</div>
          <p class="desc">3:4 轮播图 · 6 帧 · 钩子 + 干货 + CTA。直接喂给 caiji-xhs-writer 渲染。</p>
          <p class="text-xs text-ink-500 mt-2">适用：种草 / 流量 / 引流公众号 · <span class="text-accent-500">→ action=share</span></p>
        </button>
        <button class="template-card" data-template="mindmap">
          <span class="icon">🧠</span>
          <div class="title">思维导图</div>
          <p class="desc">Markdown 树形结构 + 节点高亮。结构化呈现整本书 / 整章的核心脉络。</p>
          <p class="text-xs text-ink-500 mt-2">适用：复习 / 分享 / 二次创作 · <span class="text-accent-500">→ action=note + 树形化</span></p>
        </button>
        <button class="template-card" data-template="card_share">
          <span class="icon">💳</span>
          <div class="title">卡片分享</div>
          <p class="desc">3 张金句卡片（1:1），朋友圈 / 微信群 / 即刻 通用。</p>
          <p class="text-xs text-ink-500 mt-2">适用：日常发圈 / 个人 IP · <span class="text-accent-500">→ action=quote</span></p>
        </button>
      </div>
    </section>

    <!-- ========== 生成结果区 ========== -->
    <section id="result-section" class="hidden mb-10">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold">
          生成结果
          <span id="result-template-label" class="text-sm text-ink-500 ml-2"></span>
        </h2>
        <div class="flex items-center gap-2">
          <button id="copy-result" class="px-3 py-1.5 text-xs rounded-md border border-ink-300 hover:border-ink-900">复制</button>
          <button id="download-md" class="px-3 py-1.5 text-xs rounded-md border border-ink-300 hover:border-ink-900">下载 .md</button>
        </div>
      </div>
      <div id="result-meta" class="text-xs text-ink-500 mb-3"></div>
      <pre id="result-content" class="p-4 md:p-6 rounded-lg border border-paper-200 bg-paper-50 text-sm whitespace-pre-wrap font-sans overflow-x-auto"></pre>

      <!-- 导出 -->
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <span class="text-sm text-ink-500">导出到：</span>
        <button class="export-btn px-3 py-1.5 text-xs rounded-md border border-ink-300 hover:border-ink-900" data-export="feishu">📋 飞书</button>
        <button class="export-btn px-3 py-1.5 text-xs rounded-md border border-ink-300 hover:border-ink-900" data-export="obsidian">📂 Obsidian</button>
        <button class="export-btn px-3 py-1.5 text-xs rounded-md border border-ink-300 hover:border-ink-900" data-export="markdown">⬇ Markdown</button>
        <button class="export-btn px-3 py-1.5 text-xs rounded-md border border-ink-300 hover:border-ink-900" data-export="copy">📄 复制全部</button>
      </div>
    </section>

    <!-- ========== 历史记录 ========== -->
    <section>
      <h2 class="text-lg font-semibold mb-3">历史笔记</h2>
      <div id="notes-history" class="space-y-2">
        <p class="text-sm text-ink-500">暂无历史笔记</p>
      </div>
    </section>

  </main>

  <footer class="border-t border-paper-200 py-8 text-center text-xs text-ink-500">
    <p>© 2026 读透（ReadDeep）</p>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      App.track('page_view', { page: 'workshop' });

      const TEMPLATES = {
        wechat_article: '公众号长文',
        xhs_6frame:     '小红书 6 帧图文',
        mindmap:        '思维导图',
        card_share:     '卡片分享',
      };

      // 前端 4 模板 → 后端 4 action 映射
      // 公众号长文 / 思维导图 复用后端 note 输出（前端再二次加工）
      // 小红书 6 帧 → 后端 share
      // 卡片分享   → 后端 quote
      const TEMPLATE_TO_ACTION = {
        wechat_article: 'note',
        xhs_6frame:     'share',
        mindmap:        'note',
        card_share:     'quote',
      };

      const contextInfo = document.getElementById('context-info');
      const resultSection = document.getElementById('result-section');
      const resultLabel = document.getElementById('result-template-label');
      const resultMeta = document.getElementById('result-meta');
      const resultContent = document.getElementById('result-content');
      const copyBtn = document.getElementById('copy-result');
      const downloadBtn = document.getElementById('download-md');
      const notesHistoryEl = document.getElementById('notes-history');

      let currentResult = null;
      let currentTemplate = null;
      let latestNote = null;

      // 1. 加载最近一次笔记
      const notes = App.getNotes();
      if (notes.length > 0) {
        latestNote = notes[notes.length - 1];
        contextInfo.innerHTML = `当前：<span class="font-semibold">${escapeHtml(latestNote.bookTitle || '未关联')}</span> · 第 ${(latestNote.chapter || 0) + 1} 章 · 思考题 ${latestNote.answers?.length || 0} 道 · <a href="reader.html" class="text-accent-500 hover:underline">换一本</a>`;
      }

      // 2. 历史列表
      if (notes.length > 0) {
        notesHistoryEl.innerHTML = notes.slice().reverse().slice(0, 10).map(n => `
          <div class="p-3 rounded border border-paper-200 bg-paper-50 text-sm flex items-center justify-between">
            <div>
              <span class="font-semibold">${escapeHtml(n.bookTitle || '未关联')}</span>
              <span class="text-xs text-ink-500 ml-2">第 ${(latestNote.chapter || 0) + 1} 章</span>
              <span class="text-xs text-ink-500 ml-2">${n.template ? `· ${TEMPLATES[n.template] || n.template}` : '· 未生成'}</span>
            </div>
            <span class="text-xs text-ink-500">${(n.createdAt || '').slice(0, 10)}</span>
          </div>
        `).join('');
      }

      // 3. 模板点击 → 调后端 /api/workshop
      document.querySelectorAll('.template-card').forEach(btn => {
        btn.addEventListener('click', async () => {
          const tpl = btn.dataset.template;
          await generate(tpl);
        });
      });

      /**
       * 构造 input：把 latestNote 转成 AI 可读的原文
       * 用法：把"用户答过的题"和"陪读上下文"拼成一段自然语言
       */
      function buildInput(note) {
        const ctx = `《${note.bookTitle || '未指定'}》第 ${(note.chapter || 0) + 1} 章`;
        const answers = (note.answers || []).map((a, i) => `思考题 ${i + 1}：${a.question || ''}\n我的回答：${a.answer || ''}`).join('\n\n');
        const dialogue = (note.dialogue || []).slice(-6).map(d => `${d.role || 'user'}：${d.text || ''}`).join('\n');
        return `${ctx}\n\n【我的回答】\n${answers || '（暂无回答）'}\n\n【陪读对话节选】\n${dialogue || '（暂无）'}`;
      }

      /**
       * 构造 bookContext
       */
      function buildBookContext(note) {
        return {
          title: note.bookTitle || '未指定',
          author: note.bookAuthor || '佚名',
          chapter: `第 ${(note.chapter || 0) + 1} 章`,
        };
      }

      /**
       * 调后端 /api/workshop
       */
      async function callWorkshopApi(action, input, bookContext) {
        const resp = await fetch('/api/workshop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, input, bookContext, difficulty: '入门' }),
        });
        const j = await resp.json();
        if (!resp.ok || !j.ok) {
          throw new Error(j.error || `HTTP ${resp.status}`);
        }
        return j;
      }

      /**
       * v2 · 2026-06-09 荀彧反向检查后整改
       * 公众号长文：从 parsed 提取金句（如果 note action 返回），不再硬编码
       */
      function wrapAsWechatArticle(bookCtx, noteReply, parsedQuotes) {
        const quotes = Array.isArray(parsedQuotes) ? parsedQuotes : [];
        const quotesBlock = quotes.length > 0
          ? quotes.map(q => `> **${q.quote || ''}**\n> *—— ${q.source || 'AI 提炼'}*\n> *${q.reflection || ''}*`).join('\n\n')
          : '> （本章 AI 提炼金句未返回 · 可重试或联系开发者）';
        return `# ${bookCtx.title} · ${bookCtx.chapter} 读书笔记

> **AI 陪读 · 主公定制版** · 生成时间：${new Date().toLocaleString('zh-CN')}

## 一、为什么读这一章

${bookCtx.title} 是中国/西方经典中的重要著作。本章聚焦于核心思想的展开——它不是孤立的概念，而是连接前后章节的桥梁。读透这一章，能让你对作者的整体框架有更扎实的把握。

## 二、本章核心要点（AI 提炼）

${noteReply}

## 三、本章金句（AI 提炼）

${quotesBlock}

## 四、推荐行动

1. **今天就做**：把本章最触动你的一句话写进自己的笔记
2. **本周尝试**：用 1 段话向朋友讲清楚本章的核心
3. **下章预告**：带着"哪些问题没回答"的心态进入下一章

## 五、读透的 4 把钥匙

- **领读人** 拆解背景，**苏格拉底** 追问假设
- **画师** 画出画面，**金句捕手** 抓住金句
- 4 把钥匙配合 = 一本书 = 一套可发布的内容

---

> 本文由「读透 ReadDeep」AI 陪读生成 · 主公亲自参与陪读对话
> [→ 回到陪读室](reader.html) · [→ 笔记工坊再生成](workshop.html)

© 2026 读透（ReadDeep）
`;
      }

      /**
       * v2 · 2026-06-09 荀彧反向检查后整改
       * 思维导图：暂未接后端 mindmap action（推到 D3）
       * 当前直接展示后端 note 输出的 markdown（让用户看到原始内容）
       */
      function wrapAsMindmap(bookCtx, noteReply) {
        return `# ${bookCtx.title} · 思维导图素材

> ⚠️ **D3 待接入**：思维导图新版（专门 tree-structured markdown）正在设计
> 当前展示后端 note 原始输出 — 可直接复制到 Obsidian / Xmind 手动画

---

${noteReply}

---

### 临时树形化（供粘贴到 Markdown 笔记）

请把上面的要点按层级整理：
- 中心主题：${bookCtx.title}
- 一级分支：核心观点 / 论证结构 / 关键术语 / 行动建议

© 2026 读透（ReadDeep）
`;
      }

      /**
       * v2 · 2026-06-09 荀彧反向检查后整改
       * 卡片分享：从后端 quote 输出的 parsed 取金句，不再硬编码
       */
      function wrapAsCardShare(bookCtx, parsed) {
        const quotes = Array.isArray(parsed) ? parsed.slice(0, 3) : [];
        const cards = [`# ${bookCtx.title} · 3 张金句卡`, '', `> AI 提炼 · ${new Date().toLocaleDateString('zh-CN')}`, ''];

        if (quotes.length === 0) {
          cards.push('## ⚠️ 后端未返回金句 JSON');
          cards.push('');
          cards.push('（请检查：1. 原文够长吗？2. 答过思考题吗？）');
          return cards.join('\n');
        }

        quotes.forEach((q, i) => {
          cards.push(`## 卡 ${i + 1}`);
          cards.push('');
          cards.push(`> **${q.quote || '（无原文）'}**`);
          cards.push('');
          if (q.source) cards.push(`*—— ${q.source}*`);
          if (q.reflection) cards.push(`*${q.reflection}*`);
          cards.push('');
        });

        cards.push('---');
        cards.push('（1:1 卡片可粘贴到「卡片分享」渲染 Skill → 朋友圈/即刻 通用）');
        return cards.join('\n');
      }

      /**
       * 构造 bookContext
       */
      function buildBookContext(note) {
        return {
          title: note.bookTitle || '未指定',
          author: note.bookAuthor || '佚名',
          chapter: `第 ${(note.chapter || 0) + 1} 章`,
        };
      }

      /**
       * 调后端 /api/workshop
       */
      async function callWorkshopApi(action, input, bookContext) {
        const resp = await fetch('/api/workshop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, input, bookContext, difficulty: '入门' }),
        });
        const j = await resp.json();
        if (!resp.ok || !j.ok) {
          throw new Error(j.error || `HTTP ${resp.status}`);
        }
        return j;
      }

      /**
       * v2 · 2026-06-09 荀彧反向检查后整改
       * 公众号长文：从 parsed 提取金句（如果 note action 返回），不再硬编码
       * （新版定义在 buildBookContext 上面）
       */

      async function generate(templateKey) {
        if (!latestNote) {
          alert('请先去陪读室读一章，再回来生成笔记');
          location.href = 'reader.html';
          return;
        }

        const action = TEMPLATE_TO_ACTION[templateKey];
        if (!action) {
          resultMeta.textContent = '❌ 模板未映射到后端 action';
          return;
        }

        currentTemplate = templateKey;
        resultLabel.textContent = `· ${TEMPLATES[templateKey]}`;
        resultMeta.textContent = `生成中…（action=${action} · DeepSeek v4-flash）`;
        resultContent.textContent = '';
        resultSection.classList.remove('hidden');
        resultSection.scrollIntoView({ behavior: 'smooth' });

        try {
          const t0 = Date.now();
          const input = buildInput(latestNote);
          const bookContext = buildBookContext(latestNote);
          const apiResp = await callWorkshopApi(action, input, bookContext);
          const elapsed = Date.now() - t0;

          let displayText;
          const bookCtx = `${latestNote.bookTitle} · ${bookContext.chapter}`;

          if (templateKey === 'wechat_article') {
            // 包装为 公众号长文（1500-2500 字）
            // 联动：再调一次 quote action 拿金句列表（后台已扩 maxTokens）
            let parsedQuotes = null;
            try {
              const quoteResp = await callWorkshopApi('quote', input, bookContext);
              parsedQuotes = quoteResp.parsed;
            } catch (e) {
              console.warn('[wechat_article] 联动 quote 失败：', e.message);
            }
            displayText = wrapAsWechatArticle(bookContext, apiResp.reply, parsedQuotes);
          } else if (templateKey === 'mindmap') {
            // 包装为 思维导图
            displayText = wrapAsMindmap(bookContext, apiResp.reply);
          } else if (templateKey === 'card_share') {
            // 包装为 卡片分享（用后端 parsed JSON）
            displayText = wrapAsCardShare(bookContext, apiResp.parsed);
          } else if (templateKey === 'xhs_6frame') {
            // 直接显示 6 帧 JSON
            if (apiResp.parsed && Array.isArray(apiResp.parsed)) {
              displayText = JSON.stringify(apiResp.parsed, null, 2);
            } else {
              displayText = `⚠️ 后端未返回 6 帧 JSON（parseError: ${apiResp.parseError || '无'}）\n\n原始回复：\n${apiResp.reply}`;
            }
          } else {
            displayText = apiResp.reply;
          }

          currentResult = displayText;
          resultContent.textContent = displayText;
          resultMeta.innerHTML = `✅ 完成 · 模板：${TEMPLATES[templateKey]} · action=${action} · ${bookCtx} · 用时 ${elapsed}ms · 模型 ${apiResp.model} · tokens ${apiResp.usage?.total_tokens || '?'}`;

          // 更新笔记草稿
          latestNote.template = templateKey;
          latestNote.result = displayText;
          App.saveNote(latestNote);

          App.track('note_generate', {
            template: templateKey,
            action,
            bookId: latestNote.bookId,
            chapter: latestNote.chapter,
            elapsedMs: elapsed,
          });
        } catch (e) {
          console.error('[generate] 失败', e);
          resultMeta.innerHTML = `❌ 失败：<code>${escapeHtml(e.message || String(e))}</code>`;
          resultContent.textContent = '';
          App.track('note_generate_error', {
            template: templateKey,
            action,
            error: e.message,
          });
        }
      }

      // 4. 复制 / 下载 / 导出
      copyBtn.addEventListener('click', async () => {
        if (!currentResult) return;
        try {
          await navigator.clipboard.writeText(currentResult);
          copyBtn.textContent = '已复制';
          setTimeout(() => { copyBtn.textContent = '复制'; }, 1200);
          App.track('book_share', { action: 'copy', template: currentTemplate });
        } catch (e) {
          console.warn('[copy] 失败', e);
        }
      });

      downloadBtn.addEventListener('click', () => {
        if (!currentResult || !latestNote) return;
        const blob = new Blob([currentResult], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${latestNote.bookTitle || 'note'}_${currentTemplate}_${Date.now()}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        App.track('book_share', { action: 'download_md', template: currentTemplate });
      });

      document.querySelectorAll('.export-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.export;
          if (target === 'copy') { copyBtn.click(); return; }
          if (target === 'markdown') { downloadBtn.click(); return; }
          if (target === 'feishu') {
            alert('D2 接入：复制到飞书剪贴板 → 在飞书文档 Cmd+V 即可（API 待 D4）');
            App.track('book_share', { action: 'export_feishu', template: currentTemplate });
            return;
          }
          if (target === 'obsidian') {
            alert('D2 接入：下载到本地 → 拖入 范家书阁/02-学习/ 目录即可（同步走 obsidian-mcp-sync）');
            App.track('book_share', { action: 'export_obsidian', template: currentTemplate });
            return;
          }
        });
      });

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    });
  </script>
</body>
</html>
