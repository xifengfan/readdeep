# P2-readdeep · Cloudflare Workers 自动部署
# 触发：push 到 main 分支
# 来源：https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
# 关键点：用官方 cloudflare/wrangler-action@v3，不要裸跑 wrangler CLI
# DEEPSEEK_API_KEY 在 Cloudflare Dashboard 配（不通过 workflow 推，避免 first-deploy 死锁）

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许在 Actions 页面手动触发，方便调试

concurrency:
  group: production-deploy
  cancel-in-progress: false # 部署排队而非取消，避免半成品上生产

jobs:
  deploy:
    name: Deploy readdeep to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      # D14 fix: GitHub 2026-06-16 强制切 Node 24，actions/checkout 等 JS actions 在窗口期会报 Node 20 deprecation
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          # Cloudflare 认证
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # 锁定 wrangler 版本（与本地一致，避免 v4 默认行为差异）
          # 本地实测 wrangler 3.x 兼容本项目 compatibility_date = 2024-09-23
          wranglerVersion: "3.91.0"

          # D14 pre-flight: 临时跑 whoami 验证 token，验证成功后再改回 deploy
          command: whoami

          # DEEPSEEK_API_KEY 不通过 workflow 推（避免 first-deploy 死锁：
          # action 会在 deploy 之前先调 wrangler secret put，而 worker 还不存在
          # 导致 "Failed to upload secrets"）。
          # 该 secret 已在 Cloudflare Dashboard 配好（wrangler.toml 注释有说明），
          # 部署时 wrangler 会自动从 dashboard 拉下来。
